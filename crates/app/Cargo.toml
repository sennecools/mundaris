[package]
name = "mundaris_app"
version.workspace = true
edition.workspace = true
publish = false
default-run = "mundaris_app"

[features]
surface-profile = ["mundaris_renderer/surface-profile"]
terrain-capture = ["mundaris_renderer/terrain-capture", "dep:png"]
developer-tools = ["terrain-capture", "surface-profile", "mundaris_renderer/developer-tools", "dep:sha2", "dep:base64"]

[dependencies]
anyhow.workspace = true
egui.workspace = true
glam.workspace = true
mundaris_math = { path = "../math" }
mundaris_renderer = { path = "../renderer" }
mundaris_simulation = { path = "../simulation" }
mundaris_world = { path = "../world" }
png = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[[bin]]
name = "mundaris_dev"
path = "src/bin/mundaris_dev.rs"
required-features = ["developer-tools"]

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "trail_history"
harness = false

[[bench]]
name = "celestial_navigation"
harness = false

[[bench]]
name = "orbit_guides"
harness = false

[[bench]]
name = "planet_surface_approach"
harness = false

[[bench]]
name = "planet_terrain_generation"
harness = false

[[bench]]
name = "planet_terrain_erosion"
harness = false

[[example]]
name = "terrain_lighting_capture"
required-features = ["terrain-capture"]

[[example]]
name = "terrain_adaptive_capture"
required-features = ["terrain-capture"]

[[example]]
name = "terrain_transition_capture"
required-features = ["terrain-capture"]

[[example]]
name = "solar_system_capture"
required-features = ["terrain-capture"]

[[example]]
name = "developer_capture"
required-features = ["terrain-capture"]

[[example]]
name = "moon_surface_reference"
required-features = ["terrain-capture"]

[[example]]
name = "surface_family_reference"
required-features = ["terrain-capture"]

[[example]]
name = "resident_tile_capture"
required-features = ["developer-tools"]

[[example]]
name = "resident_hierarchy_capture"
required-features = ["developer-tools"]

[[example]]
name = "regional_terrain_capture"
required-features = ["developer-tools"]

[[example]]
name = "resident_tile_samples"

[[bench]]
name = "planet_terrain_view"
harness = false

[[bench]]
name = "terrain_lighting"
harness = false

[[example]]
name = "sky_capture"
required-features = ["terrain-capture"]

