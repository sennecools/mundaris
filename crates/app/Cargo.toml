[package]
name = "astrum_app"
version.workspace = true
edition.workspace = true
publish = false
default-run = "astrum_app"

[features]
surface-profile = ["astrum_renderer/surface-profile"]
terrain-capture = ["astrum_renderer/terrain-capture", "dep:png"]
developer-tools = ["terrain-capture", "surface-profile", "astrum_renderer/developer-tools", "dep:base64"]

[dependencies]
anyhow.workspace = true
glam.workspace = true
astrum_core = { path = "../core" }
astrum_math = { path = "../math" }
astrum_renderer = { path = "../renderer" }
astrum_simulation = { path = "../simulation" }
astrum_world = { path = "../world" }
png = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
wgpu.workspace = true
winit.workspace = true
sha2 = "0.10"
base64 = { version = "0.22", optional = true }

[[bin]]
name = "astrum_dev"
path = "src/bin/astrum_dev.rs"
required-features = ["developer-tools"]

[dev-dependencies]
criterion.workspace = true
pollster.workspace = true

[[bench]]
name = "trail_history"
harness = false

[[bench]]
name = "celestial_navigation"
harness = false

[[bench]]
name = "orbit_guides"
harness = false


[lints]
workspace = true
