[package]
name = "mundaris_app"
version.workspace = true
edition.workspace = true
publish = false
default-run = "mundaris_app"

[features]
surface-profile = ["mundaris_renderer/surface-profile"]
terrain-capture = ["mundaris_renderer/terrain-capture", "dep:png"]
developer-tools = ["terrain-capture", "surface-profile", "mundaris_renderer/developer-tools", "dep:base64"]

[dependencies]
anyhow.workspace = true
egui.workspace = true
glam.workspace = true
mundaris_math = { path = "../math" }
mundaris_renderer = { path = "../renderer" }
mundaris_simulation = { path = "../simulation" }
mundaris_world = { path = "../world" }
png = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
sha2 = "0.10"
base64 = { version = "0.22", optional = true }

[[bin]]
name = "mundaris_dev"
path = "src/bin/mundaris_dev.rs"
required-features = ["developer-tools"]

[dev-dependencies]
criterion.workspace = true
wgpu.workspace = true
pollster.workspace = true

[[example]]
name = "phase2g_vista"
required-features = ["developer-tools"]

[[bench]]
name = "trail_history"
harness = false

[[bench]]
name = "celestial_navigation"
harness = false

[[bench]]
name = "orbit_guides"
harness = false


[lints]
workspace = true
