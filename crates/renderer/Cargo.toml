[package]
name = "mundaris_renderer"
version.workspace = true
edition.workspace = true
publish = false

[features]
developer-tools = []
# Explicit diagnostic timing; ordinary preparation has no clock reads.
surface-profile = ["dep:cpu-time"]
terrain-capture = []

[dependencies]
cpu-time = { version = "1.0.0", optional = true }
mundaris_math = { path = "../math" }
naga.workspace = true
glam.workspace = true
pollster.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "view_preparation"
harness = false

[[bench]]
name = "celestial_preparation"
harness = false



[lints]
workspace = true
