[package]
name = "mundaris_renderer"
version.workspace = true
edition.workspace = true
publish = false

[features]
developer-tools = []
# Explicit diagnostic timing; ordinary preparation has no clock reads.
surface-profile = ["dep:cpu-time"]
terrain-capture = []

[dependencies]
cpu-time = { version = "1.0.0", optional = true }
mundaris_math = { path = "../math" }
glam.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

# Keep wgpu-hal and gpu-allocator on the same Windows bindings version for
# their shared DX12 interface types (wgpu 30 accepts windows 0.62).
[target.'cfg(windows)'.dependencies]
windows = "=0.62.0"

[dev-dependencies]
criterion.workspace = true
naga.workspace = true

[[bench]]
name = "view_preparation"
harness = false

[[bench]]
name = "celestial_preparation"
harness = false

[[bench]]
name = "planet_surface"
harness = false

[[bench]]
name = "planet_surface_profile"
harness = false
required-features = ["surface-profile"]

[lints]
workspace = true
