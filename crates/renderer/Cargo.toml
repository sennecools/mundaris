[package]
name = "mundaris_renderer"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Explicit diagnostic timing; ordinary preparation has no clock reads.
surface-profile = []

[dependencies]
mundaris_math = { path = "../math" }
glam.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
criterion.workspace = true
naga.workspace = true

[[bench]]
name = "view_preparation"
harness = false

[[bench]]
name = "celestial_preparation"
harness = false

[[bench]]
name = "planet_surface"
harness = false

[[bench]]
name = "planet_surface_profile"
harness = false
required-features = ["surface-profile"]

[lints]
workspace = true
