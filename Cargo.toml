[workspace]
members = [
    "crates/app",
    "crates/core",
    "crates/math",
    "crates/world",
    "crates/simulation",
    "crates/renderer",
    "crates/terrain_bake",
    "crates/terrain_fields",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0"
criterion = { version = "0.8.2", default-features = false }
glam = "0.30"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30"
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui-winit = { version = "=0.36.2", default-features = false }
winit = "0.30"

[workspace.lints.rust]
# Library crates also `#![forbid(unsafe_code)]` at their roots.
unsafe_code = "deny"
unused_must_use = "deny"
