<!doctype html>
<meta charset="utf-8">
<title>Gas-giant shallow-water experiment</title>
<style>
body{margin:0;background:#101722;color:#e7edf5;font:15px system-ui,sans-serif}header{padding:18px 24px;background:#192536}h1{font-size:20px;margin:0 0 8px}main{padding:20px;max-width:1150px;margin:auto}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button,input,select{background:#26374b;color:inherit;border:1px solid #53677d;padding:7px;border-radius:4px}#image{width:min(100%,960px);image-rendering:pixelated;border:1px solid #465a70}#legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.item{background:#1a2737;padding:9px;border-radius:4px}small{color:#aab8c9}pre{white-space:pre-wrap;color:#becbda}canvas{background:#182435;width:100%;max-width:960px;height:190px}
</style>
<header><h1>Thermal shallow-water experiment</h1><small>Periodic square domain — not a spherical planet. Effective buoyancy is a thermal variable, not kelvin.</small></header>
<main><div class="controls"><label>Run folder <input id="files" type="file" webkitdirectory multiple></label><button id="back">◀</button><button id="play">Play</button><button id="forward">▶</button><input id="frame" type="range" min="0" value="0"><span id="status">Choose a folder containing paired frame-*.json and frame-*.png files.</span></div>
<img id="image" alt="Six scalar field panels"><div id="legend"></div><h3>Zonal wind profile (m/s)</h3><canvas id="plot" width="960" height="190"></canvas><pre id="meta"></pre></main>
<script>
const input=document.querySelector('#files'), range=document.querySelector('#frame'), image=document.querySelector('#image');let frames=[],index=0,timer=null;
const labels=['u','vorticity','buoyancy_anomaly','depth_anomaly','tracer','speed'];
input.onchange=async()=>{const files=[...input.files],byName=new Map(files.map(f=>[f.name,f]));frames=[];for(const f of files.filter(x=>/^frame-\d+\.json$/.test(x.name)).sort((a,b)=>a.name.localeCompare(b.name))){const png=byName.get(f.name.replace('.json','.png'));if(png)frames.push({data:JSON.parse(await f.text()),png:URL.createObjectURL(png)});}index=0;range.max=Math.max(0,frames.length-1);show();};
function show(){if(!frames.length)return;const {data,png}=frames[index];image.src=png;range.value=index;document.querySelector('#status').textContent=`${index+1}/${frames.length} · tick ${data.tick} · t=${data.time_nondimensional.toPrecision(5)} nondimensional · ${data.physical_time_s.toPrecision(5)} s physical`;document.querySelector('#legend').innerHTML=labels.map((x,i)=>{const r=data.field_ranges[x];return `<div class="item"><b>${i+1}. ${x.replaceAll('_',' ')}</b><br><small>linear per-frame range: ${r.min.toPrecision(4)} … ${r.max.toPrecision(4)}</small></div>`}).join('');document.querySelector('#meta').textContent=`Model: ${data.model}; N=${data.resolution}; geometry: periodic square [0,2π)², NOT a sphere.\nVelocity normalized by wave speed; buoyancy is an effective thermal variable, not kelvin.\n${JSON.stringify(data.diagnostics,null,2)}`;plot(data.diagnostics?.zonal_wind_m_s||[]);}
function plot(a){const c=document.querySelector('#plot'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);if(!a.length){g.fillStyle='#aab8c9';g.fillText('No zonal profile in this diagnostic record.',20,28);return}const lo=Math.min(...a),hi=Math.max(...a),span=hi-lo||1;g.strokeStyle='#63c4dc';g.beginPath();a.forEach((v,i)=>{const x=24+i*(c.width-48)/Math.max(1,a.length-1),y=c.height-20-(v-lo)/span*(c.height-40);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#c5d2df';g.fillText(`${lo.toPrecision(3)} to ${hi.toPrecision(3)} m/s`,12,14)}
range.oninput=()=>{index=+range.value;show()};document.querySelector('#back').onclick=()=>{index=Math.max(0,index-1);show()};document.querySelector('#forward').onclick=()=>{index=Math.min(frames.length-1,index+1);show()};document.querySelector('#play').onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='Play'}else{timer=setInterval(()=>{index=(index+1)%frames.length;show()},350);e.target.textContent='Pause'}};
</script>
