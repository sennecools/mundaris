# Keep the primary model user-selected; these defaults apply only to children.
[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
max_concurrent_threads_per_session = 6

[mcp_servers.mundaris]
command = "cargo"
args = ["run", "--locked", "--release", "-p", "mundaris_app", "--features", "developer-tools", "--bin", "mundaris_dev", "--", "mcp"]
startup_timeout_sec = 180
tool_timeout_sec = 600
